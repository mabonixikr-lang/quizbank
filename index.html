<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>اختبار العربية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: one centered question card, framed like the printed worksheet (double border), options stacked as a/b/c rows. */
:root {
  --bg: #f1f4f1;
  --card: #ffffff;
  --ink: #1b2a26;
  --muted: #5b6b66;
  --line: #d5ddd8;
  --accent: #1f6b57;
  --accent-ink: #ffffff;
  --gold: #a88a3d;
  --rose: #d9a5a5;
  --good: #1d7a4a;
  --good-bg: #e3f3ea;
  --bad: #b3362f;
  --bad-bg: #f8e4e2;
  --font-display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "Cairo", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a18; --card: #1a2522; --ink: #e8efec; --muted: #9aaba5; --line: #2f3f3a;
    --accent: #4fb596; --accent-ink: #0b1613; --gold: #c9aa5a; --rose: #7a4a4a;
    --good: #5ccf93; --good-bg: #17352a; --bad: #ff8a80; --bad-bg: #3b1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a18; --card: #1a2522; --ink: #e8efec; --muted: #9aaba5; --line: #2f3f3a;
  --accent: #4fb596; --accent-ink: #0b1613; --gold: #c9aa5a; --rose: #7a4a4a;
  --good: #5ccf93; --good-bg: #17352a; --bad: #ff8a80; --bad-bg: #3b1f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 1.9rem; margin: 0; font-weight: 700; text-wrap: balance; }
.score-live { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.frame { border: 2px solid var(--gold); padding: 5px; background: var(--card); }
.frame-in { border: 2px solid var(--rose); padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.qnum { font-size: 0.8rem; letter-spacing: .06em; color: var(--muted); }
.qtext { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.7; margin: 0; text-wrap: balance; }
.qtext .num { color: var(--accent); margin-inline-start: 6px; }
.pic { display: flex; justify-content: center; }
.pic svg { width: 96px; height: 96px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%;
  background: transparent; color: var(--ink); text-align: start;
  border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px;
  font-family: var(--font-display); font-size: 1.45rem; cursor: pointer; min-height: 56px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .tag {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); font-family: var(--font-body); font-size: 0.9rem; font-weight: 700; direction: ltr; color: var(--muted);
}
.opt .mark { margin-inline-start: auto; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--good); background: var(--good-bg); }
.opt.good .tag { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.good .mark { color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .tag { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.bad .mark { color: var(--bad); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.msg { font-size: 0.95rem; font-weight: 600; }
.msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
.btn {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  font-family: var(--font-body); font-weight: 700; font-size: 1rem; padding: 10px 22px; cursor: pointer;
}
.btn[hidden] { display: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.result { text-align: center; gap: 14px; align-items: center; }
.big { font-family: var(--font-display); font-size: 3.6rem; font-weight: 700; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.review { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: start; }
.review h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 4px; }
.rev-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-display); font-size: 1.2rem; }
.rev-item small { font-family: var(--font-body); color: var(--muted); font-size: 0.8rem; }
.rev-item b { color: var(--good); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header>
    <h1>اختبار العربية</h1>
    <span class="score-live" id="live"></span>
  </header>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <main class="frame"><div class="frame-in" id="card"></div></main>
</div>

<script>
var TRI = '<svg viewBox="0 0 100 100" aria-label="شكل هندسي"><polygon points="50,12 90,84 10,84" fill="none" stroke="#e39a45" stroke-width="5" stroke-linejoin="round"/></svg>';
var SHIRT = '<svg viewBox="0 0 100 100" aria-label="صورة"><path d="M34 14 L16 24 L8 44 L24 50 L28 44 L28 88 L72 88 L72 44 L76 50 L92 44 L84 24 L66 14 Q50 26 34 14 Z" fill="#26292b" stroke="#26292b" stroke-width="2" stroke-linejoin="round"/><path d="M50 26 L50 88" stroke="#6b7073" stroke-width="1.5"/><circle cx="50" cy="40" r="1.8" fill="#9aa0a3"/><circle cx="50" cy="54" r="1.8" fill="#9aa0a3"/><circle cx="50" cy="68" r="1.8" fill="#9aa0a3"/></svg>';

var Q = [
 {n:20, q:'مَا اسْمُ شَهْرِ «أُغُسْطُس» فِي اللُّغَةِ الْعَرَبِيَّةِ؟', o:['أَيْلُول','آب','تِشْرِين'], c:1},
 {n:21, q:'اخْتَرْ صَحِيحًا مِنَ الْآتِيَةِ', o:['مِهَة','مِعَة','مِائَة'], c:2},
 {n:22, q:'مَيِّزِ الشَّاذَّ', o:['الْغَسَّالَة','التَّنُّورَة','الإِزَار'], c:0},
 {n:23, q:'مَيِّزِ الشَّاذَّ', o:['السَّمَك','الْجَرَاد','الزَّرَافَة'], c:1},
 {n:24, q:'اكْتُبِ الْجَمْعَ لِكَلِمَةِ «فَرْخ»', o:['فَرْخَات','فَرِخُون','أَفْرَاخ'], c:2},
 {n:25, q:'مَا هُوَ لَوْنُ الْغُرَابِ؟', o:['أَبْيَض','أَسْوَد','أَحْمَر'], c:1},
 {n:26, q:'اكْتُبِ اسْمَ الشَّكْلِ الْهَنْدَسِيِّ', pic:TRI, o:['مُرَبَّع','دَائِرَة','مُثَلَّث'], c:2},
 {n:27, q:'الْمُحَامِي يَعْمَلُ فِي ............', o:['الْمُسْتَشْفَى','الْمَحْكَمَة','الْمَدْرَسَة'], c:1},
 {n:28, q:'أَمَام × وَرَاء ، تَحْت × ............', o:['فَوْق','أَمَام','خَلْف'], c:0},
 {n:29, q:'شَجَرَة، جَمْعُهَا ............؟', o:['شُجُور','أَشْجَار','شَجَرَان'], c:1},
 {n:30, q:'مَا هُوَ مُتَرَادِفُ «بَيْت»؟', o:['مَنْزِل','سَيَّارَة','مَدْرَسَة'], c:0},
 {n:31, q:'مَا هُوَ الشَّاذُّ؟', o:['مَوْز','تُفَّاح','بَامِيَا'], c:2},
 {n:32, q:'اكْتُبِ اسْمَ الصُّورَةِ', pic:SHIRT, o:['قُبَّعَة','حِذَاء','قَمِيص'], c:2},
 {n:33, q:'اكْتُبْ ضِدَّ «مَسْرُور»', o:['حَزِين','سَعِيد','كَبِير'], c:0},
 {n:34, q:'عَرِّبْ كَلِمَةَ : DOCTOR', o:['مُهَنْدِس','مُعَلِّم','طَبِيب'], c:2},
 {n:35, q:'مِنْ أَيْنَ نَحْصُلُ عَلَى الشَّتْلَاتِ وَالْحُبُوبِ؟', o:['مَكْتَبُ الزِّرَاعَة','الْمَكْتَبَة','الْمَخْبَز'], c:0},
 {n:36, q:'مُفْرَدُ كَلِمَةِ «بَنَات»', o:['أُخْت','بِنْت','وَلَد'], c:1},
 {n:37, q:'أَنَا حَيَوَانٌ صَغِيرٌ، عَلَى ظَهْرِي ثَلَاثَةُ خُطُوطٍ، مَنْ أَنَا؟', o:['أَرْنَب','ثَعْلَب','سِنْجَاب'], c:2},
 {n:38, q:'مَيِّزْ غَيْرَ الْمُتَجَانِسِ مِنَ الْآتِي', o:['سَيَّارَة','قِطَار','حَافِلَة'], c:1},
 {n:39, q:'أَب = وَالِد ، دَار = مَنْزِل ، أُمّ = ............', o:['وَالِدَة','عَمَّة','أَخ'], c:0},
 {n:40, q:'مَنْ شَاعِرُ النِّيل؟', o:['نَجِيب مَحْفُوظ','أَحْمَد شَوْقِي','حَافِظ إِبْرَاهِيم'], c:2}
];
var LET = ['a','b','c'];
var i = 0, score = 0, missed = [], locked = false;
var card = document.getElementById('card'), prog = document.getElementById('prog'), live = document.getElementById('live');
function ar(n){ return String(n).replace(/\d/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function show(){
  locked = false;
  var q = Q[i];
  prog.style.width = (i / Q.length * 100) + '%';
  live.textContent = 'النتيجة ' + ar(score) + ' / ' + ar(i);
  var h = '<div class="qnum">السؤال ' + ar(i+1) + ' من ' + ar(Q.length) + '</div>';
  h += '<p class="qtext"><span class="num">' + ar(q.n) + '.</span>' + esc(q.q) + '</p>';
  if (q.pic) h += '<div class="pic">' + q.pic + '</div>';
  h += '<div class="opts" role="group" aria-label="الخيارات">';
  q.o.forEach(function(t, k){
    h += '<button type="button" class="opt" data-k="' + k + '"><span class="tag">' + LET[k] + '</span><span>' + esc(t) + '</span><span class="mark"></span></button>';
  });
  h += '</div><div class="foot"><span class="msg" id="msg" aria-live="polite"></span><button type="button" class="btn" id="next" hidden>' + (i === Q.length-1 ? 'عرض النتيجة' : 'التالي') + '</button></div>';
  card.innerHTML = h;
  card.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click', function(){ pick(+b.dataset.k); }); });
  document.getElementById('next').addEventListener('click', function(){ i++; i < Q.length ? show() : finish(); });
}

function pick(k){
  if (locked) return; locked = true;
  var q = Q[i], btns = card.querySelectorAll('.opt'), msg = document.getElementById('msg');
  btns.forEach(function(b){ b.disabled = true; });
  btns[q.c].classList.add('good'); btns[q.c].querySelector('.mark').textContent = 'الصحيحة';
  if (k === q.c) { score++; msg.textContent = 'أحسنت! إجابة صحيحة'; msg.className = 'msg good'; }
  else { btns[k].classList.add('bad'); btns[k].querySelector('.mark').textContent = 'خطأ'; missed.push(i); msg.textContent = 'إجابة خاطئة'; msg.className = 'msg bad'; }
  live.textContent = 'النتيجة ' + ar(score) + ' / ' + ar(i+1);
  var nx = document.getElementById('next'); nx.hidden = false; nx.focus();
}

function finish(){
  prog.style.width = '100%';
  live.textContent = '';
  var h = '<div class="result" style="display:flex;flex-direction:column;gap:14px;align-items:center">';
  h += '<div class="qnum">النتيجة النهائية</div><div class="big">' + ar(score) + ' / ' + ar(Q.length) + '</div>';
  h += '<p class="qtext" style="font-size:1.4rem">' + (score === Q.length ? 'ممتاز! كل الإجابات صحيحة' : score >= Q.length * 0.7 ? 'جيد جدًا، واصل التقدم' : 'حاول مرة أخرى لتتحسن نتيجتك') + '</p>';
  if (missed.length) {
    h += '<div class="review"><h2>راجع أخطاءك</h2>';
    missed.forEach(function(m){
      var q = Q[m];
      h += '<div class="rev-item"><small>' + ar(q.n) + '</small><span>' + esc(q.q) + '</span><b>' + esc(q.o[q.c]) + '</b></div>';
    });
    h += '</div>';
  }
  h += '<button type="button" class="btn" id="again">ابدأ من جديد</button></div>';
  card.innerHTML = h;
  document.getElementById('again').addEventListener('click', function(){ i = 0; score = 0; missed = []; show(); });
}
show();
</script>

</body></html>
